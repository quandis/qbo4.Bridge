<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>qbo4.Bridge Sample Page</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript" src="/scripts/qbo4.Bridge.js" defer></script>
    <script type="text/javascript">
        //        document.addEventListener("DOMContentLoaded", function () {
        // google.charts.load('current', { 'packages': ['table', 'charteditor', 'corechart'] });
        // google.charts.setOnLoadCallback(drawTable);

        //new Promise(function (resolve, reject) {
        //    google.charts.setOnLoadCallback(function () { resolve(); });
        //}).then(loadDashboard);

        //        });

        // function loadDashboard() {
        document.addEventListener("qbo4.visualization.ready", function () {
            var db = new qbo4.visualization.dashboard({
                charts: [{
                    'chartType': 'PieChart',
                    'containerId': 'state_chart',
                    'dimension': 'State',
                    'options': {
                        'height': 500,
                        'pieHole': 0.4,
                        'pieSliceText': 'value',
                        'legend': 'right'
                    }
                }, {
                    'chartType': 'PieChart',
                    'containerId': 'city_chart',
                    'dimension': 'City',
                    'filters': ['State'],
                    'options': {
                        'pieSliceText': 'value',
                        'legend': 'right',
                        'is3D': true,
                        'sliceVisibilityThreshold': .1
                    }
                }, {
                    'chartType': 'Table',
                    'filters': ['State', 'City'],
                    'options': {
                        'title': 'qbo4 Demo',
                        'legend': 'none',
                        'page': 'enable',
                        'pageSize': 50,
                        'allowHtml': true
                    },
                    'view': {
                        columns: [
                            {
                                label: 'Loan', type: 'string', calc: (table, row) => {
                                    var data = getRow(table, row);
                                    return `<a target="_blank" href="/api/loan/${data.LoanID}">${data.Loan}</a>`;
                                }
                            },
                            3,
                            4,
                            {
                                label: 'Address', type: 'string', calc: (table, row) => {
                                    var data = getRow(table, row);
                                    return `<a target="_blank" href="/api/property/${data.PropertyID}">${data.Address}<br/>${data.City}, ${data.State} ${data.PostalCode}</a>`;
                                }
                            }]
                    },
                    'containerId': 'table_div'
                }]
            });
            db.draw('/api/loan/search?displaysize=100');
            window.db = db;
        });

        function getRow(view, row) {
            var data = {};
            for (var i = 0; i < view.getNumberOfColumns(); i++)
                data[view.getColumnId(i)] = view.getValue(row, i);
            return data;
        }

    </script>
</head>
<body>
    <div>
        <div id="dashboard_div" class="container">
            <div class="row">
                <h3>Google Table Example</h3>
            </div>
            <div class="row">
                <form class="form-inline">
                    <input id="url" class="form-control" type="text" value="/api/loan/search" /> <button onclick="loadData(window.db.draw(document.getElementById('url').value)); return false;" class="btn btn-primary">Refresh</button>
                </form>
            </div>
            <div class="row">
                <div id="state_chart" class="col">State</div>
                <div id="city_chart" class="col">City</div>
            </div>
            <div class="row">
                <div id="table_div" class="col">Table</div>
            </div>
        </div>
    </div>

</body>
</html>
