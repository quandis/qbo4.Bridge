<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Loan Visualization</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="application/javascript" src="/Scripts/qbo4.Bridge.js" defer></script>
    <script type="application/javascript" src="/Scripts/qbo4.Visualization.js" defer></script>
    <script type="application/javascript">
        document.addEventListener("qbo4.visualization.ready", function () {
            const db = new qbo4.visualization.dashboard({
                charts: [{
                    'chartType': 'PieChart',
                    'containerId': 'state_chart',
                    'dimension': 'State',
                    'options': {
                        'height': 500,
                        'pieHole': 0.2,
                        'pieSliceText': 'value',
                        'legend': 'left'
                    }
                }, {
                    'chartType': 'PieChart',
                    'containerId': 'city_chart',
                    'dimension': 'City',
                    'filters': ['State'],
                    'options': {
                        'pieSliceText': 'value',
                        'legend': 'right'
                    }
                }, {
                    'chartType': 'Table',
                    'filters': ['State', 'City'],
                    'options': {
                        'title': 'qbo4 Demo',
                        'legend': 'none',
                        'page': 'enable',
                        'pageSize': 8,
                        'allowHtml': true
                    },
                    'view': {
                        columns: [
                            {
                                label: 'Loan', type: 'string', calc: (table, row) => {
                                    const data = qbo4.visualization.getRow(table, row);
                                    return `<a target="_blank" href="/api/loan/${data.LoanID}">${data.Loan}</a>`;
                                }
                            },
                            3,
                            {
                                label: 'Servicer', type: 'string', calc: (table, row) => {
                                    const data = qbo4.visualization.getRow(table, row);
                                    return `<a target="_blank" href="/api/organization/${data.ServicerID}">${data.Servicer}</a>`;
                                }
                            },
                            {
                                label: 'Address', type: 'string', calc: (table, row) => {
                                    const data = qbo4.visualization.getRow(table, row);
                                    return `<a target="_blank" href="/api/property/${data.PropertyID}">${data.Address}<br/>${data.City}, ${data.State} ${data.PostalCode}</a>`;
                                }
                            }]
                    },
                    'containerId': 'table_div'
                }]
            });
            db.draw('loans.json');
            window.db = db;
        });
    </script>
</head>
<body>
    <div>
        <div id="dashboard_div" class="container">
            <div class="row">
                <h3>Loan Charing Sample</h3>
            </div>
            <div class="row">
                <div id="state_chart" class="col">State</div>
                <div id="city_chart" class="col">City</div>
            </div>
            <div class="row">
                <div id="table_div" class="col">Table</div>
            </div>
        </div>
    </div>
</body>
</html>
