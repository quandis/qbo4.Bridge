<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Loan Visualization</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="application/javascript" src="/Scripts/qbo4.Bridge.js" defer></script>
    <script type="application/javascript" src="/Scripts/qbo4.Visualization.js" defer></script>
    <script type="application/javascript" src="loans.js" defer></script>
    <style>
        .chartLoading {
            background: transparent;
            background-image: url("https://digitalsynopsis.com/wp-content/uploads/2016/06/loading-animations-preloader-gifs-ui-ux-effects-18.gif");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }
    </style>
</head>
<body>
    <div>
        <div id="dashboard_div" class="container">
            <div class="row">
                <h3>Loan Charting Sample</h3>
            </div>
            <div class="row" style="height:500px">
                <div id="servicer_chart" class="col chartLoading">Servicer</div>
                <div id="state_chart" class="col chartLoading">State</div>
            </div>
            <div class="row" style="height:500px">
                <div id="status_chart" class="col chartLoading">Status</div>
                <div id="type_chart" class="col chartLoading">Type</div>
            </div>
            <div class="row" style="height:500px">
                <div id="upb_chart" class="col chartLoading">UPB</div>
                <div id="other_chart" class="col "></div>
            </div>
            <div class="row">
                <div id="table_div" class="col chartLoading">Table</div>
            </div>
        </div>
    </div>
</body>
</html>
